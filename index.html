<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BotHanzi</title>
  <meta name="description" content="Nauka znaków hanzi: poziomy HSK, fiszki i wyszukiwarka bez tonów.">
  <meta name="theme-color" content="#123026">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BotHanzi">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <nav class="tabbar" id="tabbar" aria-label="Główna nawigacja"></nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="sheet" class="sheet-root" hidden></div>
  <div id="session" class="session" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>BotHanzi wymaga włączonego JavaScriptu.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>

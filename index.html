<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BotHanzi</title>
  <meta name="description" content="Nauka znaków hanzi: poziomy HSK, fiszki, quiz i wyszukiwarka bez tonów.">
  <meta name="theme-color" content="#123026">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BotHanzi">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    /* Ustaw motyw przed pierwszym malowaniem (rodzina-tryb), żeby nie było błysku domyślnych kolorów. Logika jak w js/themes.js. */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('bothanzi:v1')) || {}, t = s.theme, m = s.themeMode;
        var L = { las: ['las', 'dark'], poranek: ['las', 'light'], bursztyn: ['bursztyn', 'dark'], granat: ['granat', 'dark'], luxury: ['luxury', 'dark'], cynober: ['cynober', 'light'], dark: ['las', 'dark'], light: ['las', 'light'], auto: ['las', 'auto'] };
        if (!m && L[t]) { m = L[t][1]; t = L[t][0]; }
        if (!/^(las|herbata|zmierzch|noc|tusz|bursztyn|granat|luxury|cynober)$/.test(t)) t = 'las';
        if (m !== 'dark' && m !== 'light') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t + '-' + m);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="flame-out" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c92c61"/><stop offset=".6" stop-color="#f07aa0"/><stop offset="1" stop-color="#ffc2d4"/></linearGradient>
      <linearGradient id="flame-in" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f07aa0"/><stop offset="1" stop-color="#fff0e6"/></linearGradient>
    </defs>
  </svg>
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <a class="brandmark" href="#/home" aria-label="BotHanzi, strona startowa">
          <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><g id="ant"><path d="M27 33C22 27 20 21 18 11"/><path d="M23 25L12 21"/><path d="M20 17L20 8"/><path d="M25 29L16 30"/></g><use href="#ant" transform="translate(64 0) scale(-1 1)"/></g><path d="M25 35Q32 30 39 35L32 56Z" fill="currentColor" opacity=".55"/></svg>
        </a>
        <div class="searchbox" role="search">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="Szukaj: ma, woda, tree" aria-label="Szukaj znaku w całej bazie" aria-controls="searchpanel">
          <button class="clear" id="q-clear" type="button" hidden aria-label="Wyczyść wyszukiwanie">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
          </button>
        </div>
        <button class="icon-btn" type="button" data-act="mode" id="mode-btn" aria-label="Przełącz na jasny tryb">
          <svg class="ico ico-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
          <svg class="ico ico-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        </button>
        <button class="icon-btn" type="button" data-act="theme" aria-label="Wybierz motyw kolorystyczny">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-.9 2-1.8 0-.7-.4-1.2-.4-1.9 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10" cy="7" r="1" fill="currentColor"/><circle cx="15" cy="7.5" r="1" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="searchpanel" id="searchpanel" hidden></div>
    </header>
    <nav class="tabbar" id="tabbar" aria-label="Główna nawigacja"></nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="sheet" class="sheet-root" hidden></div>
  <div id="session" class="session" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>BotHanzi wymaga włączonego JavaScriptu.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
